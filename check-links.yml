name: Check recipe links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checker dependency
        run: python -m pip install --upgrade requests

      - name: Check all recipe links
        run: python check_links.py recipe_links.csv reports

      - name: Upload link audit report
        uses: actions/upload-artifact@v4
        with:
          name: recipe-link-audit
          path: reports/
          if-no-files-found: error
          retention-days: 30
